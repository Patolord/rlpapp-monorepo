# Builds the desktop takeoff app (apps/takeoff): the Windows installer and the macOS disk image,
# signs the updater artifacts and publishes them to a GitHub Release in the PUBLIC repository
# Patolord/takeoff-releases whenever a tag takeoff-v1.2.3 is pushed. `pnpm release 1.2.3` (in
# apps/takeoff) creates that tag. Installed apps read
# https://github.com/Patolord/takeoff-releases/releases/latest/download/latest.json and offer
# the update themselves (tauri-action merges each platform into the same latest.json). The
# release in takeoff-releases keeps the plain v1.2.3 name used before the move to the monorepo.
#
# macOS builds are ad-hoc signed (no Apple Developer account): fine for internal distribution;
# the first launch of a downloaded .dmg needs right-click > Open once.
#
# Required secrets in this (private) repository:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/takeoff.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/takeoff.key.password
#   RELEASE_TOKEN                       a GitHub token allowed to create releases in takeoff-releases
name: takeoff-release

on:
  push:
    tags: ["takeoff-v*"]
  # Manual fallback for when the tag cannot be pushed from where the release is driven (e.g. a
  # cloud session that may only push its own branch): the run checks the version against
  # tauri.conf.json, tags the dispatched commit itself and goes on exactly as a tag push would.
  # The tag is created with GITHUB_TOKEN, so it does not start a second run.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (1.2.3); must equal the version in apps/takeoff/src-tauri/tauri.conf.json"
        required: true

permissions:
  contents: write

jobs:
  # The public repository has no copy of this commit, so the release (and its tag) is created
  # there first, pointing at its own main; the build jobs then upload into it by id.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Tag the dispatched commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          CONFIGURED=$(jq -r .version apps/takeoff/src-tauri/tauri.conf.json)
          if [ "$VERSION" != "$CONFIGURED" ]; then
            echo "::error::Requested $VERSION but apps/takeoff/src-tauri/tauri.conf.json says $CONFIGURED; run 'pnpm release $VERSION' in apps/takeoff first."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/takeoff-v$VERSION" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/takeoff-v$VERSION" -f sha="$GITHUB_SHA"
          fi

      - name: Create the release in the public repository
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          REPO=Patolord/takeoff-releases
          TAG="v${VERSION#takeoff-v}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target main \
              --title "RLP Takeoff $TAG" \
              --notes "Windows: RLP.Takeoff_<versão>_x64-setup.exe · macOS: RLP.Takeoff_<versão>_universal.dmg (primeira abertura: botão direito > Abrir). O app instalado oferece as versões seguintes sozinho."
          fi
          echo "id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            targets: ""
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/takeoff/src-tauri

      # only the takeoff app and the workspace packages it depends on
      - run: pnpm install --frozen-lockfile --filter takeoff...

      - if: matrix.os == 'windows-latest'
        run: pnpm -F takeoff check-types && pnpm -F takeoff test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # no Apple Developer account: ad-hoc signature, enough for internal distribution
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
        with:
          projectPath: apps/takeoff
          tauriScript: pnpm tauri
          owner: Patolord
          repo: takeoff-releases
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Rebuilds latest.json from the assets that are actually on the release once the builds are
  # done, after checking each signature against the artifact next to it with the app's public
  # key. tauri-action merges its own latest.json into the existing one and keeps the darwin-*
  # entries it finds there, so on a re-run (one job failed, the workflow was dispatched again)
  # the macOS signature stayed the one from the previous run while the .app.tar.gz it signs had
  # been replaced, and the updater rejected the update. Runs even when a build failed: the
  # entries then still describe the assets that are there (a failed job never replaces its
  # artifact), and a pair that does not verify fails the run instead of being published.
  updater-json:
    needs: [create-release, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/takeoff/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - run: sudo apt-get update -q && sudo apt-get install -y -q minisign

      - name: Rebuild latest.json from the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          REPO=Patolord/takeoff-releases
          TAG="v${VERSION#takeoff-v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          jq -r .plugins.updater.pubkey apps/takeoff/src-tauri/tauri.conf.json | base64 -d > pubkey.txt
          mkdir assets
          gh release download "$TAG" --repo "$REPO" --dir assets \
            --pattern '*.sig' --pattern '*.exe' --pattern '*.app.tar.gz'
          # Prints {signature, url} for an artifact, or "null" when the platform is not on the
          # release at all. An artifact without its .sig (or the other way round), or a
          # signature that does not verify against the artifact, fails the job.
          entry() {
            local a="assets/$1"
            if [ ! -e "$a" ] && [ ! -e "$a.sig" ]; then echo null; return; fi
            if [ ! -e "$a" ] || [ ! -e "$a.sig" ]; then
              echo "::error::$1: the artifact and its .sig must both be on the release" >&2
              return 1
            fi
            base64 -d "$a.sig" > "$a.sig.txt"
            if ! minisign -Vm "$a" -x "$a.sig.txt" -p pubkey.txt >&2; then
              echo "::error::$1: the published .sig does not verify against the published artifact" >&2
              return 1
            fi
            jq -n --arg url "$BASE/$1" --arg sig "$(tr -d '\n\r' < "$a.sig")" \
              '{signature: $sig, url: $url}'
          }
          # GitHub stores "RLP Takeoff_1.2.3_x64-setup.exe" as "RLP.Takeoff_1.2.3_x64-setup.exe"
          MAC=$(entry "RLP.Takeoff_universal.app.tar.gz") || exit 1
          WIN=$(entry "RLP.Takeoff_${TAG#v}_x64-setup.exe") || exit 1
          jq -n --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson mac "$MAC" --argjson win "$WIN" '
            {version: $version, notes: "", pub_date: $date,
             platforms: ({
               "darwin-aarch64": $mac, "darwin-x86_64": $mac,
               "darwin-aarch64-app": $mac, "darwin-x86_64-app": $mac,
               "windows-x86_64": $win, "windows-x86_64-nsis": $win
             } | with_entries(select(.value != null)))}' > latest.json
          jq -e '.platforms | length > 0' latest.json >/dev/null
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
