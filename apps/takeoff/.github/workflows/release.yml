# Builds the Windows installer, signs the updater artifacts and publishes a GitHub Release
# whenever a version tag (v1.2.3) is pushed. `bun run release 1.2.3` creates that tag.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/takeoff.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/takeoff.key.password
#
# The release carries Takeoff_x.y.z_x64-setup.exe (NSIS), Takeoff_x.y.z_x64_en-US.msi, the
# .sig files and latest.json. Copy latest.json plus the .exe/.sig it references to the updater
# endpoint configured in src-tauri/tauri.conf.json (plugins.updater.endpoints), or point that
# endpoint at the GitHub Release download URL if the repository is public.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - run: bun run check-types && bun run test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Takeoff ${{ github.ref_name }}"
          releaseBody: "Instalador Windows (.exe) e atualização assinada (latest.json)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
