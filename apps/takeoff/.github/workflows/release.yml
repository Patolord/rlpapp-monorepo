# Builds the Windows installer, signs the updater artifacts and publishes a GitHub Release in
# the PUBLIC repository Patolord/takeoff-releases whenever a version tag (v1.2.3) is pushed here.
# `bun run release 1.2.3` creates that tag. Installed apps read
# https://github.com/Patolord/takeoff-releases/releases/latest/download/latest.json and offer
# the update themselves.
#
# Required secrets in this (private) repository:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/takeoff.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/takeoff.key.password
#   RELEASE_TOKEN                       a GitHub token allowed to create releases in takeoff-releases
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - run: bun run check-types && bun run test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Patolord
          repo: takeoff-releases
          tagName: ${{ github.ref_name }}
          releaseName: "Takeoff ${{ github.ref_name }}"
          releaseBody: "Instalador Windows (.exe) e atualização assinada (latest.json)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
