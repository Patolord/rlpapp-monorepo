# Builds the Windows installer, signs the updater artifacts and publishes a GitHub Release in
# the PUBLIC repository Patolord/takeoff-releases whenever a version tag (v1.2.3) is pushed here.
# `bun run release 1.2.3` creates that tag. Installed apps read
# https://github.com/Patolord/takeoff-releases/releases/latest/download/latest.json and offer
# the update themselves.
#
# Required secrets in this (private) repository:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/takeoff.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/takeoff.key.password
#   RELEASE_TOKEN                       a GitHub token allowed to create releases in takeoff-releases
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - run: bun run check-types && bun run test

      # The public repository has no copy of this commit, so the release (and its tag) is
      # created there first, pointing at its own main; tauri-action then uploads into it.
      - name: Create the release in the public repository
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          REPO=Patolord/takeoff-releases
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target main \
              --title "RLP Takeoff $TAG" \
              --notes "Instalador Windows (.exe) e atualização assinada (latest.json). O app instalado oferece esta versão sozinho."
          fi
          echo "id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Patolord
          repo: takeoff-releases
          releaseId: ${{ steps.rel.outputs.id }}
          includeUpdaterJson: true
