# Quality gates on every pull request and on pushes to main: types, lint and unit tests for the
# frontend, formatting and clippy for the Rust side. The release workflow keeps its own
# check-types + test step as a last gate before publishing.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - run: bun install --frozen-lockfile

      - name: Types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! needs frontendDist (../dist) to exist; the frontend itself is not
      # built here, the web job covers it.
      - name: Placeholder frontend
        run: mkdir -p ../dist

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings
